name: Publish public Taken Faceclaims

on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate public feed
        env:
          KH_FEED_URL: ${{ vars.KH_FEED_URL }}
        run: python scripts/update_faceclaims.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
